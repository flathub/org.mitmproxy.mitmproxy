app-id: org.mitmproxy.mitmproxy
runtime: org.freedesktop.Sdk
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: mitmproxy
finish-args:
  - --share=network
  - --filesystem=xdg-documents
modules:         
  - name: mitmproxy
    buildsystem: simple
    build-commands:
      - tar -xf mitmproxy.tar.gz
      - rm mitmproxy.tar.gz
      - mkdir -p /app/bin
      - find . -type f -name "mitm*" -exec install -v -Dm755 {} -t /app/bin/ \;
    post-install:
      - install -Dm644 org.mitmproxy.mitmproxy.png -t /app/share/icons/hicolor/256x256/apps/
      - install -Dm644 org.mitmproxy.mitmproxy.appdata.xml -t /app/share/appdata/
      - install -Dm644 org.mitmproxy.mitmproxy.desktop -t /app/share/applications/
    sources:
      - type: file
        url: https://downloads.mitmproxy.org/12.3.0/mitmproxy-12.3.0-linux-x86_64.tar.gz
        sha256: d52bacb30012023c7e920f322a97a6bc3b0553a7944b520e9aa02278c910b938
        dest-filename: mitmproxy.tar.gz
        only-arches:
          - x86_64
      - type: file
        url: https://downloads.mitmproxy.org/12.3.0/mitmproxy-12.3.0-linux-aarch64.tar.gz
        sha256: f8756fa831c4abe431dd922ae7291b158b465285562b35d12e5669cbfc29d1f3
        dest-filename: mitmproxy.tar.gz
        only-arches:
          - aarch64
      - type: file
        path: org.mitmproxy.mitmproxy.appdata.xml
      - type: file
        path: org.mitmproxy.mitmproxy.png
      - type: file
        path: org.mitmproxy.mitmproxy.desktop
